<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HUNT - 몬스터</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:Arial,sans-serif;
}


/* 상단 */

.topbar{
    height:70px;
    background:#111;
    display:flex;
    align-items:center;
    padding:0 20px;
    position:sticky;
    top:0;
    z-index:100;
}


/* 햄버거 */

.hamburger{
    background:none;
    border:0;
    color:white;
    font-size:30px;
    cursor:pointer;
    margin-right:15px;
}


/* HUNT */

.logo a{
    color:white;
    text-decoration:none;
    font-size:36px;
    font-weight:900;
    letter-spacing:5px;
}

.logo a:hover{
    color:#00ff66;
}


/* 메뉴 */

.side-menu{
    position:fixed;
    top:0;
    left:-280px;
    width:260px;
    height:100%;
    background:#111;
    padding-top:80px;
    transition:0.3s;
    z-index:200;
    overflow-y:auto;
}

.side-menu.open{
    left:0;
}

.side-menu a{
    display:block;
    padding:18px 25px;
    color:white;
    text-decoration:none;
    font-size:18px;
}

.side-menu a:hover{
    background:#00ff66;
    color:black;
}


/* 제목 */

.title{
    text-align:center;
    font-size:42px;
    margin:45px 0 25px;
}


/* 검색 */

.search{
    width:90%;
    max-width:600px;
    margin:0 auto 35px;
}

.search input{
    width:100%;
    padding:16px 20px;
    background:#171717;
    color:white;
    border:1px solid #333;
    border-radius:12px;
    font-size:18px;
    outline:none;
}

.search input:focus{
    border-color:#00ff66;
}


/* 목록 */

.monster-grid{
    width:90%;
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding-bottom:60px;
}


/* 카드 */

.monster-card{
    display:block;
    background:#171717;
    border:1px solid #333;
    border-radius:15px;
    padding:20px;
    color:white;
    text-decoration:none;
    transition:0.25s;
}

.monster-card:hover{
    transform:translateY(-6px);
    border-color:#00ff66;
}


/* 이미지 */

.monster-image{
    width:100%;
    height:170px;
    background:#222;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    margin-bottom:18px;
}


/* 이름 */

.monster-name{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}


/* 설명 */

.monster-info{
    color:#aaa;
    line-height:1.6;
}


/* 검색 결과 없음 */

.no-result{
    display:none;
    text-align:center;
    color:#888;
    font-size:18px;
    padding:30px;
}

</style>

</head>


<body>


<!-- 상단바 -->

<div class="topbar">

<button class="hamburger" onclick="toggleMenu()">
☰
</button>

<div class="logo">

<a href="index.html">
HUNT
</a>

</div>

</div>


<!-- 햄버거 메뉴 -->

<div id="sideMenu" class="side-menu">

<a href="index.html">🏠 홈</a>
<a href="items.html">🎒 아이템</a>
<a href="weapons.html">🔫 무기</a>
<a href="shop.html">🛒 상점</a>
<a href="npc.html">🧑 NPC</a>
<a href="weather.html">🌦️ 날씨</a>
<a href="map.html">🗺️ 맵</a>
<a href="animals.html">🐾 동물</a>
<a href="monsters.html">👹 몬스터</a>
<a href="events.html">🎉 이벤트</a>
<a href="updates.html">🔥 업데이트</a>
<a href="news.html">📰 소식</a>
<a href="settings.html">⚙️ 설정</a>

</div>


<!-- 제목 -->

<h1 class="title">
👹 몬스터
</h1>


<!-- 검색 -->

<div class="search">

<input
type="text"
id="searchInput"
placeholder="🔍 몬스터 검색..."
oninput="searchMonster()">

</div>


<!-- 몬스터 -->

<div class="monster-grid" id="monsterGrid">


<!-- 몬스터 1 -->

<a
href="monster-wolf.html"
class="monster-card"
data-name="악몽의 늑대">

<div class="monster-image">
🐺
</div>

<div class="monster-name">
악몽의 늑대
</div>

<div class="monster-info">
출현 지역 : ???<br>
난이도 : ???<br>
자세한 정보를 보려면 클릭
</div>

</a>


<!-- 몬스터 2 -->

<a
href="monster-bear.html"
class="monster-card"
data-name="광폭한 곰">

<div class="monster-image">
🐻
</div>

<div class="monster-name">
광폭한 곰
</div>

<div class="monster-info">
출현 지역 : ???<br>
난이도 : ???<br>
자세한 정보를 보려면 클릭
</div>

</a>


<!-- 몬스터 3 -->

<a
href="monster-shark.html"
class="monster-card"
data-name="심해 포식자">

<div class="monster-image">
🦈
</div>

<div class="monster-name">
심해 포식자
</div>

<div class="monster-info">
출현 지역 : 심해<br>
난이도 : ???<br>
자세한 정보를 보려면 클릭
</div>

</a>


</div>


<div id="noResult" class="no-result">
검색 결과가 없습니다.
</div>


<script>

/* 햄버거 메뉴 */

function toggleMenu(){

    const menu =
    document.getElementById("sideMenu");

    menu.classList.toggle("open");

}


/* 몬스터 검색 */

function searchMonster(){

    const input =
    document.getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

    const cards =
    document.getElementsByClassName("monster-card");

    let found = 0;

    for(let i=0;i<cards.length;i++){

        const name =
        cards[i]
        .getAttribute("data-name")
        .toLowerCase();

        if(name.includes(input)){

            cards[i].style.display="block";
            found++;

        }else{

            cards[i].style.display="none";

        }

    }


    const noResult =
    document.getElementById("noResult");

    if(found === 0){

        noResult.style.display="block";

    }else{

        noResult.style.display="none";

    }

}

</script>


</body>
</html>
