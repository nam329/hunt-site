<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HUNT - 몬스터</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,sans-serif;
}


/* ====================
   상단
==================== */

.topbar{
    height:70px;
    background:#111;
    display:flex;
    align-items:center;
    padding:0 20px;
    border-bottom:1px solid #333;
}

.logo a{
    color:#fff;
    text-decoration:none;
    font-size:36px;
    font-weight:900;
    letter-spacing:5px;
}

.logo a:hover{
    color:#00ff66;
}


/* ====================
   제목
==================== */

.title{
    text-align:center;
    font-size:42px;
    margin:40px 0 25px;
}


/* ====================
   검색
==================== */

.search{
    width:90%;
    max-width:650px;
    margin:0 auto 20px;
}

.search input{
    width:100%;
    padding:16px;
    background:#171717;
    color:white;
    border:2px solid #333;
    border-radius:0;
    font-size:18px;
    outline:none;
}

.search input:focus{
    border-color:#00ff66;
}


/* ====================
   필터
==================== */

.filters{
    width:95%;
    max-width:1100px;
    margin:0 auto 35px;
}


/* 필터 한 줄 */

.filter-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    overflow-x:auto;
    padding-bottom:3px;
}


/* 필터 버튼 */

.filter-btn{
    flex:0 0 auto;
    background:#171717;
    color:white;
    border:2px solid #333;
    border-radius:0;
    padding:13px 22px;
    font-size:16px;
    cursor:pointer;
    white-space:nowrap;
}

.filter-btn:hover{
    border-color:#00ff66;
}

.filter-btn.active{
    background:#00ff66;
    color:#000;
    border-color:#00ff66;
}


/* ====================
   몬스터 목록
==================== */

.monster-grid{
    width:90%;
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
    padding-bottom:60px;
}


/* ====================
   몬스터 카드
==================== */

.monster-card{
    display:block;
    background:#171717;
    border:2px solid #333;
    color:white;
    text-decoration:none;
    padding:18px;
    transition:0.2s;
}

.monster-card:hover{
    border-color:#00ff66;
    transform:translateY(-3px);
}


/* 이미지 */

.monster-image{
    width:100%;
    height:160px;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    margin-bottom:15px;
}


/* 이름 */

.monster-name{
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}


/* 정보 */

.monster-info{
    color:#999;
    line-height:1.6;
    font-size:14px;
}


/* 결과 없음 */

.no-result{
    display:none;
    text-align:center;
    color:#888;
    padding:40px;
}

</style>

</head>


<body>


<!-- ====================
     상단
==================== -->

<div class="topbar">

    <div class="logo">
        <a href="index.html">HUNT</a>
    </div>

</div>



<!-- ====================
     제목
==================== -->

<h1 class="title">
👹 몬스터
</h1>



<!-- ====================
     검색
==================== -->

<div class="search">

<input
type="text"
id="searchInput"
placeholder="🔍 몬스터 검색..."
oninput="filterMonsters()">

</div>



<!-- ====================
     필터
==================== -->

<div class="filters">


<!-- 1줄 : 종류 -->

<div class="filter-row">

<button
class="filter-btn active"
data-filter="type"
data-value="all"
onclick="setFilter('type','all',this)">
전체
</button>

<button
class="filter-btn"
data-filter="type"
data-value="normal"
onclick="setFilter('type','normal',this)">
일반
</button>

<button
class="filter-btn"
data-filter="type"
data-value="limited"
onclick="setFilter('type','limited',this)">
한정
</button>

</div>



<!-- 2줄 : 지역 -->

<div class="filter-row">

<button
class="filter-btn active"
data-filter="island"
data-value="all"
onclick="setFilter('island','all',this)">
전체 지역
</button>

<button class="filter-btn"
data-filter="island"
data-value="start"
onclick="setFilter('island','start',this)">
시작섬
</button>

<button class="filter-btn"
data-filter="island"
data-value="jungle"
onclick="setFilter('island','jungle',this)">
정글섬
</button>

<button class="filter-btn"
data-filter="island"
data-value="desert"
onclick="setFilter('island','desert',this)">
사막섬
</button>

<button class="filter-btn"
data-filter="island"
data-value="ignis"
onclick="setFilter('island','ignis',this)">
이그니스 섬
</button>

<button class="filter-btn"
data-filter="island"
data-value="arctic"
onclick="setFilter('island','arctic',this)">
북극
</button>

<button class="filter-btn"
data-filter="island"
data-value="deep"
onclick="setFilter('island','deep',this)">
심해
</button>

<button class="filter-btn"
data-filter="island"
data-value="swamp"
onclick="setFilter('island','swamp',this)">
늪지대
</button>

<button class="filter-btn"
data-filter="island"
data-value="crystal"
onclick="setFilter('island','crystal',this)">
크리스탈 섬
</button>

</div>



<!-- 3줄 : 등급/분류 -->

<div class="filter-row">

<button
class="filter-btn active"
data-filter="rank"
data-value="all"
onclick="setFilter('rank','all',this)">
전체
</button>

<button
class="filter-btn"
data-filter="rank"
data-value="normal"
onclick="setFilter('rank','normal',this)">
일반
</button>

<button
class="filter-btn"
data-filter="rank"
data-value="midboss"
onclick="setFilter('rank','midboss',this)">
중간보스
</button>

<button
class="filter-btn"
data-filter="rank"
data-value="worldboss"
onclick="setFilter('rank','worldboss',this)">
월드보스
</button>

<button
class="filter-btn"
data-filter="rank"
data-value="unknown"
onclick="setFilter('rank','unknown',this)">
???
</button>

</div>

</div>



<!-- ====================
     몬스터 목록
==================== -->

<div class="monster-grid" id="monsterGrid">



<!-- 몬스터 -->

<a
href="monster-wolf.html"
class="monster-card"
data-name="악몽의 늑대"
data-type="normal"
data-island="start"
data-rank="normal">

<div class="monster-image">
🐺
</div>

<div class="monster-name">
악몽의 늑대
</div>

<div class="monster-info">
출현 지역 : 시작섬<br>
분류 : 일반
</div>

</a>



<a
href="monster-bear.html"
class="monster-card"
data-name="광폭한 곰"
data-type="normal"
data-island="jungle"
data-rank="normal">

<div class="monster-image">
🐻
</div>

<div class="monster-name">
광폭한 곰
</div>

<div class="monster-info">
출현 지역 : 정글섬<br>
분류 : 일반
</div>

</a>



<a
href="monster-shark.html"
class="monster-card"
data-name="심해 포식자"
data-type="normal"
data-island="deep"
data-rank="midboss">

<div class="monster-image">
🦈
</div>

<div class="monster-name">
심해 포식자
</div>

<div class="monster-info">
출현 지역 : 심해<br>
분류 : 중간보스
</div>

</a>



<a
href="monster-event.html"
class="monster-card"
data-name="이벤트 몬스터"
data-type="limited"
data-island="crystal"
data-rank="worldboss">

<div class="monster-image">
👹
</div>

<div class="monster-name">
이벤트 몬스터
</div>

<div class="monster-info">
출현 지역 : 크리스탈 섬<br>
분류 : 월드보스<br>
한정
</div>

</a>


</div>



<div
id="noResult"
class="no-result">

검색 결과가 없습니다.

</div>



<script>

/* 현재 필터 */

let filters = {

    type:"all",
    island:"all",
    rank:"all"

};



/* 필터 선택 */

function setFilter(category,value,button){

    filters[category]=value;


    const buttons =
    document.querySelectorAll(
        '.filter-btn[data-filter="'+category+'"]'
    );


    buttons.forEach(function(btn){

        btn.classList.remove("active");

    });


    button.classList.add("active");


    filterMonsters();

}



/* 검색 + 필터 */

function filterMonsters(){

    const search =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();


    const cards =
    document.querySelectorAll(".monster-card");


    let count=0;


    cards.forEach(function(card){

        const name =
        card
        .getAttribute("data-name")
        .toLowerCase();


        const type =
        card.getAttribute("data-type");


        const island =
        card.getAttribute("data-island");


        const rank =
        card.getAttribute("data-rank");


        const searchMatch =
        name.includes(search);


        const typeMatch =
        filters.type==="all" ||
        type===filters.type;


        const islandMatch =
        filters.island==="all" ||
        island===filters.island;


        const rankMatch =
        filters.rank==="all" ||
        rank===filters.rank;


        if(
            searchMatch &&
            typeMatch &&
            islandMatch &&
            rankMatch
        ){

            card.style.display="block";
            count++;

        }else{

            card.style.display="none";

        }

    });


    document.getElementById("noResult").style.display =
    count===0 ? "block" : "none";

}

</script>


</body>
</html>
