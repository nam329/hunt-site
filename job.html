<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HUNT - 직업</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    padding:20px;
}

.section{
    background:#1b1b1b;
    border:2px solid #00ff66;
    border-radius:12px;
    margin-bottom:20px;
    overflow:hidden;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    cursor:pointer;
    font-size:22px;
    font-weight:bold;
    background:#191919;
}

.header:hover{
    background:#242424;
}

.content{
    display:none;
    padding:15px;
}

.scroll{
    max-height:350px;
    overflow-y:auto;
}

.scroll::-webkit-scrollbar{
    width:8px;
}

.scroll::-webkit-scrollbar-thumb{
    background:#00ff66;
    border-radius:10px;
}

.job{
    display:block;
    text-decoration:none;
    color:white;
    padding:15px;
    margin-bottom:10px;
    background:#2a2a2a;
    border-radius:10px;
    transition:.2s;
}

.job:hover{
    background:#00aa55;
}

.update{
    background:#222;
    padding:12px;
    border-radius:8px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="section">

<div class="header" onclick="toggle('jobs')">
<span>💼 직업 보기</span>
<span id="jobsBtn">▶</span>
</div>

<div id="jobs" class="content">

<div class="scroll">

<a class="job" href="job/warrior.html">
⚔️ 전사
</a>

<a class="job" href="job/archer.html">
🏹 궁수
</a>

<a class="job" href="job/mage.html">
🔥 마법사
</a>

<a class="job" href="job/paladin.html">
🛡️ 성기사
</a>

<a class="job" href="job/assassin.html">
🗡️ 암살자
</a>

<a class="job" href="job/priest.html">
💚 사제
</a>

<a class="job" href="job/engineer.html">
🤖 기계공
</a>

<a class="job" href="job/shadow.html">
🌑 그림자 기사
</a>

<a class="job" href="job/lightning.html">
⚡ 번개 검사
</a>

<a class="job" href="job/shaman.html">
❄️ 주술사
</a>

</div>

</div>

</div>

<div class="section">

<div class="header" onclick="toggle('updates')">
<span>📢 변경사항</span>
<span id="updatesBtn">▶</span>
</div>

<div id="updates" class="content">

<div class="scroll">

<div class="update">
<h3>v1.0</h3>
<p>직업 시스템 추가</p>
</div>

<div class="update">
<h3>v1.1</h3>
<p>궁수 추가</p>
</div>

<div class="update">
<h3>v1.2</h3>
<p>성기사 추가</p>
</div>

<div class="update">
<h3>v1.3</h3>
<p>직업 밸런스 조정</p>
</div>

</div>

</div>

</div>

<script>
function toggle(id){

const box=document.getElementById(id);
const btn=document.getElementById(id+"Btn");

if(box.style.display==="block"){
box.style.display="none";
btn.innerHTML="▶";
}else{
box.style.display="block";
btn.innerHTML="▼";
}

}
</script>

</body>
</html>
